name: CI

on:
  push:
    branches: [main]
  # Deliberately `pull_request` (not `pull_request_target`): PR code (including
  # forks) runs with a read-only token and no access to repository secrets.
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# Cancel superseded runs on PRs, but never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  # Build and test share one job: tests resolve workspace packages (e.g.
  # @docsoc/util) through their built output, so a separate build job would
  # just repeat the install and build on a second runner.
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build all workspaces
        run: npm run build --workspaces --if-present
      - name: Run tests
        run: npm test -- --ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
